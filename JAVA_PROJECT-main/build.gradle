plugins {
    id 'java'
    id 'application'
}

group 'com.railway'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // MySQL Connector
    implementation 'com.mysql:mysql-connector-j:8.0.33'
}

application {
    mainClass = 'Main'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
